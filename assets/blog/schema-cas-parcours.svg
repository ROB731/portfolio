ise</tspan></text><circle cx="52" cy="288" r="20" fill="url(#a)"/><text x="52" y="297" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="52" dy="0">5</tspan></text><text x="90" y="297" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="600" fill="#f0f0f5" text-anchor="start"><tspan x="90" dy="0">La trace consultable</tspan></text></svg>
