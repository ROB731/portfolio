/tspan></text><rect x="28" y="246" width="273" height="66" rx="12" fill="#33335a" /><circle cx="52" cy="279" r="9" fill="#8a8aa5"/><text x="74" y="275" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#f0f0f5" text-anchor="start"><tspan x="74" dy="0">Ne connaît pas</tspan><tspan x="74" dy="24">votre métier</tspan></text><rect x="339" y="246" width="273" height="66" rx="12" fill="#33335a" /><circle cx="364" cy="279" r="9" fill="#FF6584"/><text x="388" y="275" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#f0f0f5" text-anchor="start"><tspan x="388" dy="0">Décide de</tspan><tspan x="388" dy="24">l'architecture</tspan></text><rect x="28" y="324" width="273" height="66" rx="12" fill="#33335a" /><circle cx="52" cy="357" r="9" fill="#8a8aa5"/><text x="74" y="353" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#f0f0f5" text-anchor="start"><tspan x="74" dy="0">Peut se tromper</tspan><tspan x="74" dy="24">sans le dire</tspan></text><rect x="339" y="324" width="273" height="66" rx="12" fill="#33335a" /><circle cx="364" cy="357" r="9" fill="#FF6584"/><text x="388" y="353" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#f0f0f5" text-anchor="start"><tspan x="388" dy="0">Répond du</tspan><tspan x="388" dy="24">résultat</tspan></text></svg>
